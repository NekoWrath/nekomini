version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tma_streamer_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/tma_streamer.db:/app/tma_streamer.db
    networks:
      - tma_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tma_streamer_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend
    networks:
      - tma_network

networks:
  tma_network:
    driver: bridge
