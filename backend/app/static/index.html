<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#090d16" />
  <title>Streamer Telegram Mini App</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: {
              darkest: '#090d16',
              darker: '#0d1322',
            },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          },
          boxShadow: {
            'glow-purple': '0 0 25px -5px rgba(139, 92, 246, 0.45)',
            'glow-pink': '0 0 25px -5px rgba(236, 72, 153, 0.45)',
            'glow-live': '0 0 30px rgba(239, 68, 68, 0.6)',
            'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.37)',
          },
        }
      }
    }
  </script>

  <!-- React & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #090d16;
      background-image: 
        radial-gradient(at 0% 0%, rgba(124, 58, 237, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(236, 72, 153, 0.08) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(6, 182, 212, 0.08) 0px, transparent 50%);
      background-attachment: fixed;
      color: #f1f5f9;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-panel-elevated {
      background: rgba(22, 30, 52, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(139, 92, 246, 0.25);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }
    .glass-nav {
      background: rgba(9, 13, 22, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .btn-press:active {
      transform: scale(0.96);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="min-h-screen select-none overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo } = React;

    // Telegram API Helpers
    const tg = window.Telegram?.WebApp;
    if (tg) {
      try {
        tg.ready();
        tg.expand();
        if (tg.setHeaderColor) tg.setHeaderColor('#090d16');
        if (tg.setBackgroundColor) tg.setBackgroundColor('#090d16');
      } catch (e) {}
    }

    const haptic = {
      impact: (style = 'medium') => {
        try { tg?.HapticFeedback?.impactOccurred(style); } catch(e){}
      },
      notify: (type = 'success') => {
        try { tg?.HapticFeedback?.notificationOccurred(type); } catch(e){}
      },
      select: () => {
        try { tg?.HapticFeedback?.selectionChanged(); } catch(e){}
      }
    };

    function openLink(url) {
      if (tg?.openLink) tg.openLink(url);
      else window.open(url, '_blank');
    }

    function openTgLink(url) {
      if (tg?.openTelegramLink) tg.openTelegramLink(url);
      else window.open(url, '_blank');
    }

    const CATEGORIES = {
      game_idea: { label: 'Идея для игры', emoji: '🎮', badge: 'bg-purple-500/20 text-purple-300 border-purple-500/30' },
      question: { label: 'Вопрос стримеру', emoji: '❓', badge: 'bg-cyan-500/20 text-cyan-300 border-cyan-500/30' },
      challenge: { label: 'Челлендж', emoji: '🔥', badge: 'bg-amber-500/20 text-amber-300 border-amber-500/30' },
      other: { label: 'Другое', emoji: '💬', badge: 'bg-slate-500/20 text-slate-300 border-slate-500/30' },
    };

    const STATUSES = {
      pending: { label: 'На рассмотрении', badge: 'bg-amber-500/10 text-amber-400 border-amber-500/30', icon: '⏳' },
      accepted: { label: 'Взято на стрим', badge: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30', icon: '✅' },
      rejected: { label: 'Отклонено', badge: 'bg-rose-500/10 text-rose-400 border-rose-500/30', icon: '❌' },
      answered: { label: 'Отвечено', badge: 'bg-blue-500/10 text-blue-400 border-blue-500/30', icon: '💬' },
    };

    function getYouTubeId(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function isImageUrl(url) {
      if (!url) return false;
      return (/\.(jpeg|jpg|gif|png|webp|svg)($|\?)/i).test(url) || url.includes('imgur.com') || url.includes('images.unsplash.com') || url.includes('/static/uploads/');
    }

    // Interactive HTML5 Canvas Roulette Wheel Component
    function RouletteWheel({ items, rotation, isSpinning, onSpin, isAdmin, rouletteMode }) {
      const canvasRef = useRef(null);
      const activeItems = items.filter(it => it.is_active);
      const totalPoints = activeItems.reduce((acc, it) => acc + it.points, 0);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const size = canvas.width;
        const center = size / 2;
        const radius = center - 14;

        ctx.clearRect(0, 0, size, size);

        if (activeItems.length === 0) {
          ctx.beginPath();
          ctx.arc(center, center, radius, 0, 2 * Math.PI);
          ctx.fillStyle = '#1e293b';
          ctx.fill();
          ctx.lineWidth = 4;
          ctx.strokeStyle = '#475569';
          ctx.stroke();

          ctx.fillStyle = '#94a3b8';
          ctx.font = 'bold 13px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('Добавьте лоты в аукцион', center, center);
          return;
        }

        let startAngle = rotation;

        activeItems.forEach((item) => {
          const sliceAngle = (item.points / totalPoints) * 2 * Math.PI;
          const endAngle = startAngle + sliceAngle;

          // Draw slice
          ctx.beginPath();
          ctx.moveTo(center, center);
          ctx.arc(center, center, radius, startAngle, endAngle);
          ctx.closePath();
          ctx.fillStyle = item.color || '#9333ea';
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#0f172a';
          ctx.stroke();

          // Draw label
          ctx.save();
          ctx.translate(center, center);
          ctx.rotate(startAngle + sliceAngle / 2);
          ctx.textAlign = 'right';
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 11px sans-serif';
          ctx.shadowColor = 'rgba(0,0,0,0.8)';
          ctx.shadowBlur = 4;

          const pct = Math.round((item.points / totalPoints) * 100);
          let label = item.title;
          if (label.length > 13) label = label.slice(0, 11) + '…';
          ctx.fillText(`${label} (${pct}%)`, radius - 12, 4);
          ctx.restore();

          startAngle = endAngle;
        });

        // Outer glow border
        ctx.beginPath();
        ctx.arc(center, center, radius, 0, 2 * Math.PI);
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#38bdf8';
        ctx.stroke();

        // Center Hub
        ctx.beginPath();
        ctx.arc(center, center, 22, 0, 2 * Math.PI);
        ctx.fillStyle = '#0f172a';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#f43f5e';
        ctx.stroke();

        ctx.fillStyle = '#f43f5e';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('★', center, center);

      }, [activeItems, totalPoints, rotation]);

      return (
        <div className="flex flex-col items-center justify-center relative my-1">
          <div className="relative">
            <div className="absolute -top-3 left-1/2 -translate-x-1/2 z-20 text-rose-500 text-2xl filter drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] animate-pulse pointer-events-none">
              ▼
            </div>
            <canvas
              ref={canvasRef}
              width={280}
              height={280}
              className="rounded-full shadow-2xl border-4 border-slate-800/80 bg-slate-950"
            />
          </div>

          <div className="mt-3 w-full max-w-xs flex gap-2">
            <button
              onClick={onSpin}
              disabled={isSpinning || activeItems.length < 2}
              className={`flex-1 py-3 rounded-2xl font-display font-extrabold text-sm text-white shadow-glow-live transition-all btn-press ${isSpinning || activeItems.length < 2 ? 'bg-slate-800 text-slate-500 cursor-not-allowed opacity-60' : 'bg-gradient-to-r from-rose-600 via-purple-600 to-indigo-600 hover:brightness-110'}`}
            >
              {isSpinning ? '🎲 КРУТИТСЯ...' : activeItems.length < 2 ? '⚠️ Нужно минимум 2 лота' : '🎰 КРУТИТЬ РУЛЕТКУ!'}
            </button>
          </div>
        </div>
      );
    }

    // Main App Component
    function App() {
      const isTg = Boolean(tg && tg.initData);
      const [mockRole, setMockRole] = useState('viewer');
      const [activeTab, setActiveTab] = useState('schedule');
      
      const [user, setUser] = useState(null);
      const [streamer, setStreamer] = useState(null);
      const [streams, setStreams] = useState([]);
      const [currentStream, setCurrentStream] = useState(null);
      const [suggestions, setSuggestions] = useState([]);
      const [adminStats, setAdminStats] = useState(null);

      const [sugTab, setSugTab] = useState('new');
      const [sugCat, setSugCat] = useState('all');
      const [sugSearch, setSugSearch] = useState('');
      const [dayFilter, setDayFilter] = useState('all');

      // Modals
      const [isSugModalOpen, setIsSugModalOpen] = useState(false);
      const [isStreamModalOpen, setIsStreamModalOpen] = useState(false);
      const [isBroadcastModalOpen, setIsBroadcastModalOpen] = useState(false);
      const [isProfileModalOpen, setIsProfileModalOpen] = useState(false);
      const [isVideosModalOpen, setIsVideosModalOpen] = useState(false);
      const [youtubeVideos, setYoutubeVideos] = useState([]);
      const [editingStream, setEditingStream] = useState(null);
      const [moderatingSug, setModeratingSug] = useState(null);

      // Auction & Roulette states
      const [auctionData, setAuctionData] = useState({ items: [], total_points: 0, active_count: 0 });
      const [isLotModalOpen, setIsLotModalOpen] = useState(false);
      const [targetLotForPoints, setTargetLotForPoints] = useState(null);
      const [isSpinning, setIsSpinning] = useState(false);
      const [rouletteWinner, setRouletteWinner] = useState(null);
      const [rouletteMode, setRouletteMode] = useState('elimination'); // 'elimination' (на вылет) or 'instant'
      const [wheelRotation, setWheelRotation] = useState(0);

      // Image upload states
      const [uploadingImage, setUploadingImage] = useState(false);
      const [selectedImagePreview, setSelectedImagePreview] = useState('');

      // Wallet & Stars states
      const [isWalletModalOpen, setIsWalletModalOpen] = useState(false);
      const [walletData, setWalletData] = useState(null);
      const [buyingStarsPkg, setBuyingStarsPkg] = useState(null);
      const [twitchUsernameInput, setTwitchUsernameInput] = useState('');
      const [isLinkingTwitch, setIsLinkingTwitch] = useState(false);
      const [claimingDaily, setClaimingDaily] = useState(false);

      const [toast, setToast] = useState(null);

      const showToast = (text, type = 'info') => {
        setToast({ text, type });
        if (type === 'success') haptic.notify('success');
        else if (type === 'error') haptic.notify('error');
        else haptic.impact('light');
        setTimeout(() => setToast(null), 3000);
      };

      // Fast initial hydration from Telegram
      useEffect(() => {
        if (isTg && tg.initDataUnsafe?.user) {
          const u = tg.initDataUnsafe.user;
          setUser(prev => prev || {
            telegram_id: u.id,
            first_name: u.first_name || 'Зритель',
            last_name: u.last_name,
            username: u.username,
            photo_url: u.photo_url,
            points_balance: 500,
            role: 'viewer'
          });
        }
      }, [isTg]);

      const getHeaders = useCallback(() => {
        const headers = { 'Content-Type': 'application/json' };
        if (isTg && tg.initData) {
          headers['X-Telegram-Init-Data'] = tg.initData;
        }
        if (isTg && tg.initDataUnsafe?.user?.id) {
          headers['X-Mock-User-Id'] = String(tg.initDataUnsafe.user.id);
        } else if (!isTg) {
          headers['X-Mock-User-Id'] = mockRole === 'admin' ? '123456789' : '987654321';
          headers['X-Mock-Role'] = mockRole;
        }
        return headers;
      }, [isTg, mockRole]);

      const loadVideos = useCallback(async () => {
        try {
          const res = await fetch('/api/admin/videos', { headers: getHeaders() });
          if (res.ok) setYoutubeVideos(await res.json());
        } catch(e) {}
      }, [getHeaders]);

      const loadAuction = useCallback(async () => {
        try {
          const res = await fetch('/api/auction', { headers: getHeaders() });
          if (res.ok) setAuctionData(await res.json());
        } catch(e) {}
      }, [getHeaders]);

      const loadWallet = useCallback(async () => {
        try {
          const res = await fetch('/api/wallet', { headers: getHeaders() });
          if (res.ok) {
            const d = await res.json();
            setWalletData(d);
            setUser(p => p ? { ...p, points_balance: d.points_balance, twitch_username: d.twitch_username } : p);
          }
        } catch(e) {}
      }, [getHeaders]);

      // Load Data
      const loadAll = useCallback(async () => {
        try {
          const headers = getHeaders();
          const meRes = await fetch('/api/auth/me', { headers });
          if (meRes.ok) {
            const meData = await meRes.json();
            setUser(meData);
            setStreamer(meData.streamer_info);
          }

          const [streamsRes, currRes, sugRes] = await Promise.all([
            fetch('/api/schedule', { headers }),
            fetch('/api/schedule/current', { headers }),
            fetch(`/api/suggestions?tab=${sugTab}&category=${sugCat}&search=${encodeURIComponent(sugSearch)}`, { headers })
          ]);

          if (streamsRes.ok) setStreams(await streamsRes.json());
          if (currRes.ok) setCurrentStream(await currRes.json());
          if (sugRes.ok) setSuggestions(await sugRes.json());

          loadAuction();
          loadWallet();
        } catch (e) {
          console.warn('API fetch error:', e);
        }
      }, [getHeaders, sugTab, sugCat, sugSearch, loadAuction, loadWallet]);

      useEffect(() => {
        loadAll();
      }, [loadAll]);

      // Load Admin Stats & Auction if on tab
      useEffect(() => {
        if (activeTab === 'admin' && (user?.role === 'admin' || mockRole === 'admin')) {
          fetch('/api/admin/stats', { headers: getHeaders() })
            .then(r => r.ok ? r.json() : null)
            .then(d => d && setAdminStats(d));
          loadVideos();
        }
        if (activeTab === 'auction') {
          loadAuction();
          loadWallet();
        }
      }, [activeTab, user?.role, mockRole, getHeaders, loadVideos, loadAuction, loadWallet]);

      // MainButton binding
      useEffect(() => {
        if (currentStream?.is_live && tg?.MainButton) {
          tg.MainButton.setText(`🔥 СМОТРЕТЬ НА ${currentStream.platform.toUpperCase()}`);
          tg.MainButton.setParams({ color: '#dc2626', text_color: '#ffffff' });
          tg.MainButton.onClick(() => openLink(currentStream.platform_url));
          tg.MainButton.show();
        } else if (tg?.MainButton) {
          tg.MainButton.hide();
        }
        return () => { try { tg?.MainButton?.hide(); } catch(e){} };
      }, [currentStream]);

      // Actions
      const toggleReminder = async (streamId) => {
        haptic.impact('medium');
        try {
          const res = await fetch(`/api/schedule/${streamId}/toggle-reminder`, {
            method: 'POST',
            headers: getHeaders(),
          });
          if (res.ok) {
            const data = await res.json();
            setStreams(prev => prev.map(s => s.id === streamId ? { ...s, has_reminder: data.has_reminder } : s));
            if (currentStream?.id === streamId) setCurrentStream(p => ({ ...p, has_reminder: data.has_reminder }));
            showToast(data.message, 'success');
          }
        } catch(e) { showToast('Ошибка напоминания', 'error'); }
      };

      const voteSug = async (sugId) => {
        haptic.impact('medium');
        try {
          const res = await fetch(`/api/suggestions/${sugId}/vote`, {
            method: 'POST',
            headers: getHeaders(),
          });
          if (res.ok) {
            const data = await res.json();
            setSuggestions(prev => prev.map(s => s.id === sugId ? { ...s, has_voted: data.has_voted, upvotes_count: data.upvotes_count } : s));
          }
        } catch(e) { showToast('Ошибка голосования', 'error'); }
      };

      const toggleLive = async (streamId, isLive) => {
        haptic.impact('heavy');
        try {
          const res = await fetch(`/api/schedule/${streamId}/toggle-live?send_broadcast=${!isLive}`, {
            method: 'POST',
            headers: getHeaders(),
          });
          if (res.ok) {
            const data = await res.json();
            showToast(data.is_live ? '🔴 Стрим запущен в эфир!' : '⚪️ Стрим завершен', 'success');
            loadAll();
          }
        } catch(e) { showToast('Ошибка переключения эфира', 'error'); }
      };

      const deleteSuggestion = async (sugId) => {
        if (!window.confirm('Вы уверены, что хотите удалить это предложение?')) return;
        haptic.impact('medium');
        try {
          const res = await fetch(`/api/suggestions/${sugId}`, {
            method: 'DELETE',
            headers: getHeaders()
          });
          if (res.ok) {
            showToast('Предложение удалено', 'success');
            if (moderatingSug?.id === sugId) setModeratingSug(null);
            loadAll();
          } else {
            showToast('Ошибка удаления', 'error');
          }
        } catch(e) {
          showToast('Ошибка сети', 'error');
        }
      };

      // Device Upload Handler
      const handleDeviceUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          showToast('Пожалуйста, выберите картинку (JPG, PNG, WebP, GIF)', 'error');
          return;
        }
        setUploadingImage(true);
        haptic.impact('light');
        try {
          const formData = new FormData();
          formData.append('file', file);
          const authHeaders = isTg && tg.initData
            ? { 'X-Telegram-Init-Data': tg.initData }
            : { 'X-Mock-User-Id': mockRole === 'admin' ? '123456789' : '987654321', 'X-Mock-Role': mockRole };

          const res = await fetch('/api/upload', {
            method: 'POST',
            headers: authHeaders,
            body: formData,
          });
          if (res.ok) {
            const data = await res.json();
            setSelectedImagePreview(data.url);
            showToast('Фото успешно загружено!', 'success');
          } else {
            const err = await res.json();
            showToast(err.detail || 'Ошибка загрузки фото', 'error');
          }
        } catch(err) {
          showToast('Ошибка сети при загрузке фото', 'error');
        } finally {
          setUploadingImage(false);
        }
      };

      // Spin Roulette Wheel
      const spinWheel = () => {
        if (isSpinning) return;
        const activeItems = auctionData.items.filter(it => it.is_active);
        if (activeItems.length < 2) {
          showToast('Для вращения нужно минимум 2 активных лота!', 'error');
          return;
        }
        setIsSpinning(true);
        setRouletteWinner(null);
        haptic.impact('heavy');

        const totalPoints = activeItems.reduce((acc, it) => acc + it.points, 0);
        let randomPoint = Math.random() * totalPoints;
        let selectedItem = activeItems[0];
        let accumulated = 0;
        let winnerIndex = 0;

        for (let i = 0; i < activeItems.length; i++) {
          accumulated += activeItems[i].points;
          if (randomPoint <= accumulated) {
            selectedItem = activeItems[i];
            winnerIndex = i;
            break;
          }
        }

        let startAngle = 0;
        for (let i = 0; i < winnerIndex; i++) {
          startAngle += (activeItems[i].points / totalPoints) * 2 * Math.PI;
        }
        const sectorAngle = (selectedItem.points / totalPoints) * 2 * Math.PI;
        const targetSectorCenter = startAngle + sectorAngle / 2;

        const spins = 6 + Math.floor(Math.random() * 3);
        const finalAngle = spins * 2 * Math.PI + (3 * Math.PI / 2 - targetSectorCenter) + (Math.random() * 0.4 - 0.2) * sectorAngle;

        const duration = 5500;
        const startTime = performance.now();
        const initialRotation = wheelRotation % (2 * Math.PI);

        const animate = (currentTime) => {
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const ease = 1 - Math.pow(1 - progress, 4);
          const currentRot = initialRotation + (finalAngle - initialRotation) * ease;
          setWheelRotation(currentRot);

          if (progress < 1) {
            requestAnimationFrame(animate);
          } else {
            setIsSpinning(false);
            setRouletteWinner(selectedItem);
            haptic.notify('success');
          }
        };

        requestAnimationFrame(animate);
      };

      const addPointsToLot = async (lotId, pointsToAdd) => {
        haptic.impact('medium');
        try {
          const res = await fetch(`/api/auction/items/${lotId}/add-points`, {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({ points: pointsToAdd })
          });
          if (res.ok) {
            showToast(`+${pointsToAdd} баллов добавлено!`, 'success');
            setTargetLotForPoints(null);
            loadAuction();
          }
        } catch(e) {
          showToast('Ошибка пополнения баллов', 'error');
        }
      };

      const toggleLotActive = async (lotId) => {
        haptic.impact('light');
        try {
          const res = await fetch(`/api/auction/items/${lotId}/toggle-active`, {
            method: 'POST',
            headers: getHeaders()
          });
          if (res.ok) {
            loadAuction();
          }
        } catch(e) {}

        haptic.impact('medium');
        try {

            method: 'DELETE',
            headers: getHeaders()
          });
          if (res.ok) {
            showToast('Лот удален', 'success');
            loadAuction();

          showToast('Ошибка удаления лота', 'error');

        haptic.impact('heavy');
        try {

            method: 'POST',
            headers: getHeaders()
          });
          if (res.ok) {
            showToast('Аукцион сброшен!', 'success');
            loadAuction();

        setBuyingStarsPkg(packageId);
        haptic.impact('medium');
        try {
          const res = await fetch('/api/wallet/create-invoice', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({ package_id: packageId })
          });
          if (res.ok) {
            const data = await res.json();
            if (isTg && tg?.openInvoice) {
              tg.openInvoice(data.invoice_link, (status) => {
                if (status === 'paid') {
                  showToast('🎉 Оплата звездами успешна! Баллы начислены!', 'success');
                  loadAll();
                  loadWallet();
                } else if (status === 'cancelled') {
                  showToast('Оплата отменена', 'info');
                } else if (status === 'failed') {
                  showToast('Ошибка при оплате звездами', 'error');
                }
              });
            } else {
              window.open(data.invoice_link, '_blank');
              showToast('Ссылка на оплату Telegram Stars открыта!', 'info');
            }
          } else {
            const err = await res.json();
            showToast(err.detail || 'Ошибка создания счёта', 'error');
          }

          showToast('Ошибка сети', 'error');

          setBuyingStarsPkg(null);
        }

            showToast(data.message, 'success');

            showToast(err.detail || 'Бонус пока недоступен', 'error');

              </div>
            </div>
          )}

          {/* WALLET & TOP-UP MODAL */}
          {isWalletModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-end sm:items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-900 border border-amber-500/40 rounded-3xl p-5 w-full max-w-md space-y-4 my-auto max-h-[90vh] overflow-y-auto no-scrollbar">
                
                {/* Header */}
                <div className="flex justify-between items-center sticky top-0 bg-slate-900 pt-1 pb-2 border-b border-white/5 z-10">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">💰</span>
                    <div>
                      <h3 className="font-bold text-white text-base">Кошелёк & Баллы</h3>
                      <div className="text-[11px] text-amber-300 font-semibold">
                        Баланс: {(user?.points_balance || 0).toLocaleString('ru-RU')} очков
                      </div>
                    </div>
                  </div>
                  <button onClick={() => setIsWalletModalOpen(false)} className="text-slate-400 text-sm p-1">✕</button>
                </div>

                {/* Daily Bonus Card */}
                <div className="p-3.5 rounded-2xl bg-gradient-to-r from-purple-950/60 to-indigo-950/60 border border-purple-500/30 flex items-center justify-between">
                  <div className="flex items-center gap-2.5">
                    <span className="text-2xl">🎁</span>
                    <div>
                      <div className="text-xs font-bold text-white">Ежедневный бонус</div>
                      <div className="text-[11px] text-purple-300">+100 очков каждые 24 часа</div>
                    </div>
                  </div>
                  <button
                    onClick={handleClaimDailyBonus}
                    disabled={claimingDaily || (walletData && !walletData.can_claim_daily)}
                    className={`px-3 py-1.5 rounded-xl font-bold text-xs shadow-sm transition-all btn-press ${walletData && !walletData.can_claim_daily ? 'bg-slate-800 text-slate-500 cursor-not-allowed' : 'bg-gradient-to-r from-purple-600 to-pink-600 text-white'}`}
                  >
                    {walletData && !walletData.can_claim_daily ? 'Получен ✅' : claimingDaily ? '...' : 'Забрать +100'}
                  </button>
                </div>

                {/* SECTION 1: TELEGRAM STARS (XTR) */}
                <div className="space-y-2">
                  <div className="flex items-center justify-between">
                    <h4 className="font-bold text-xs text-white flex items-center gap-1.5">
                      <span>⭐</span>
                      <span>Пополнение через Telegram Stars</span>
                    </h4>
                    <span className="text-[10px] text-amber-400 font-semibold">Мгновенно</span>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    {(walletData?.packages || [
                      { id: 'stars_50', stars: 50, points: 2500, title: 'Стартовый', bonus_label: 'Базовый', badge_color: 'bg-slate-800 text-slate-300' },
                      { id: 'stars_100', stars: 100, points: 5500, title: 'Стример', bonus_label: '+10% Бонус', badge_color: 'bg-amber-500/20 text-amber-300 border border-amber-500/40' },
                      { id: 'stars_250', stars: 250, points: 15000, title: 'VIP', bonus_label: '+20% Бонус', badge_color: 'bg-purple-500/20 text-purple-300 border border-purple-500/40' },
                      { id: 'stars_500', stars: 500, points: 35000, title: 'Легенда', bonus_label: '+40% Бонус', badge_color: 'bg-rose-500/20 text-rose-300 border border-rose-500/40' }
                    ]).map(pkg => (
                      <button
                        key={pkg.id}
                        onClick={() => handleBuyStarsPackage(pkg.id)}
                        disabled={buyingStarsPkg === pkg.id}
                        className="p-3 rounded-2xl glass-panel-elevated border border-white/10 hover:border-amber-500/50 flex flex-col items-start justify-between text-left transition-all btn-press relative overflow-hidden group"
                      >
                        <div className="flex items-center justify-between w-full mb-1">
                          <span className="font-bold text-white text-xs">{pkg.title}</span>
                          {pkg.bonus_label && (
                            <span className={`text-[9px] px-1.5 py-0.5 rounded-full font-bold ${pkg.badge_color || 'bg-purple-900 text-purple-300'}`}>
                              {pkg.bonus_label}
                            </span>
                          )}
                        </div>
                        <div className="text-amber-300 font-extrabold text-sm my-0.5">
                          {pkg.points.toLocaleString('ru-RU')} очков
                        </div>
                        <div className="mt-2 w-full py-1.5 bg-gradient-to-r from-amber-500 to-rose-500 group-hover:brightness-110 text-slate-950 font-black text-xs rounded-xl text-center shadow-md flex items-center justify-center gap-1">
                          <span>⭐</span>
                          <span>{pkg.stars} Stars</span>
                        </div>
                      </button>
                    ))}
                  </div>
                </div>

                {/* SECTION 2: TWITCH INTEGRATION */}
                <div className="p-3.5 rounded-2xl glass-panel space-y-2.5">
                  <div className="flex items-center justify-between">
                    <h4 className="font-bold text-xs text-white flex items-center gap-1.5">
                      <span>🟣</span>
                      <span>Синхронизация с Twitch</span>
                    </h4>
                    <span className="text-[10px] text-purple-300 font-semibold">Баллы канала</span>
                  </div>

                  {user?.twitch_username ? (
                    <div className="space-y-2">
                      <div className="p-2.5 rounded-xl bg-purple-950/40 border border-purple-500/30 flex items-center justify-between text-xs">
                        <div className="flex items-center gap-2">
                          <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" />
                          <span className="text-slate-300">Привязан: <strong className="text-white font-bold">@{user.twitch_username}</strong></span>
                        </div>
                        <button
                          onClick={() => setTwitchUsernameInput(user.twitch_username)}
                          className="text-[10px] text-purple-400 underline"
                        >
                          Изменить
                        </button>
                      </div>

                      <button
                        onClick={handleSyncTwitchPoints}
                        className="w-full py-2.5 bg-purple-900/60 hover:bg-purple-800/80 border border-purple-500/40 text-purple-200 font-bold text-xs rounded-xl flex items-center justify-center gap-1.5 btn-press"
                      >
                        <span>🔄</span>
                        <span>Синхронизировать баллы с Twitch (+1 000)</span>
                      </button>
                    </div>
                  ) : (
                    <form onSubmit={handleLinkTwitch} className="space-y-2">
                      <p className="text-[11px] text-slate-400">
                        Привяжи свой аккаунт Twitch и получи <strong>+250 приветственных баллов</strong>!
                      </p>
                      <div className="flex gap-1.5">
                        <input
                          value={twitchUsernameInput}
                          onChange={e => setTwitchUsernameInput(e.target.value)}
                          placeholder="Твой логин на Twitch (например: streamerfan)"
                          required
                          className="flex-1 bg-slate-950 border border-slate-700 rounded-xl p-2 text-white text-xs"
                        />
                        <button
                          type="submit"
                          disabled={isLinkingTwitch}
                          className="px-3.5 bg-purple-600 text-white font-bold rounded-xl text-xs whitespace-nowrap btn-press"
                        >
                          {isLinkingTwitch ? '...' : 'Привязать'}
                        </button>
                      </div>
                    </form>
                  )}
                </div>

              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
