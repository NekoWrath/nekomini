<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#090d16" />
  <title>Streamer Telegram Mini App</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: {
              darkest: '#090d16',
              darker: '#0d1322',
            },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          },
          boxShadow: {
            'glow-purple': '0 0 25px -5px rgba(139, 92, 246, 0.45)',
            'glow-pink': '0 0 25px -5px rgba(236, 72, 153, 0.45)',
            'glow-live': '0 0 30px rgba(239, 68, 68, 0.6)',
            'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.37)',
          },
        }
      }
    }
  </script>

  <!-- React & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #090d16;
      background-image: 
        radial-gradient(at 0% 0%, rgba(124, 58, 237, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(236, 72, 153, 0.08) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(6, 182, 212, 0.08) 0px, transparent 50%);
      background-attachment: fixed;
      color: #f1f5f9;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-panel-elevated {
      background: rgba(22, 30, 52, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(139, 92, 246, 0.25);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }
    .glass-nav {
      background: rgba(9, 13, 22, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .btn-press:active {
      transform: scale(0.96);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="min-h-screen select-none overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo } = React;

    // Telegram API Helpers
    const tg = window.Telegram?.WebApp;
    if (tg) {
      try {
        tg.ready();
        tg.expand();
        if (tg.setHeaderColor) tg.setHeaderColor('#090d16');
        if (tg.setBackgroundColor) tg.setBackgroundColor('#090d16');
      } catch (e) {}
    }

    const haptic = {
      impact: (style = 'medium') => {
        try { tg?.HapticFeedback?.impactOccurred(style); } catch(e){}
      },
      notify: (type = 'success') => {
        try { tg?.HapticFeedback?.notificationOccurred(type); } catch(e){}
      },
      select: () => {
        try { tg?.HapticFeedback?.selectionChanged(); } catch(e){}
      }
    };

    function openLink(url) {
      if (tg?.openLink) tg.openLink(url);
      else window.open(url, '_blank');
    }

    function openTgLink(url) {
      if (tg?.openTelegramLink) tg.openTelegramLink(url);
      else window.open(url, '_blank');
    }

    const CATEGORIES = {
      game_idea: { label: 'Идея для игры', emoji: '🎮', badge: 'bg-purple-500/20 text-purple-300 border-purple-500/30' },
      question: { label: 'Вопрос стримеру', emoji: '❓', badge: 'bg-cyan-500/20 text-cyan-300 border-cyan-500/30' },
      challenge: { label: 'Челлендж', emoji: '🔥', badge: 'bg-amber-500/20 text-amber-300 border-amber-500/30' },
      other: { label: 'Другое', emoji: '💬', badge: 'bg-slate-500/20 text-slate-300 border-slate-500/30' },
    };

    const STATUSES = {
      pending: { label: 'На рассмотрении', badge: 'bg-amber-500/10 text-amber-400 border-amber-500/30', icon: '⏳' },
      accepted: { label: 'Взято на стрим', badge: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30', icon: '✅' },
      rejected: { label: 'Отклонено', badge: 'bg-rose-500/10 text-rose-400 border-rose-500/30', icon: '❌' },
      answered: { label: 'Отвечено', badge: 'bg-blue-500/10 text-blue-400 border-blue-500/30', icon: '💬' },
    };

    function getYouTubeId(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function isImageUrl(url) {
      if (!url) return false;
      return (/\.(jpeg|jpg|gif|png|webp|svg)($|\?)/i).test(url) || url.includes('imgur.com') || url.includes('images.unsplash.com');
    }

    // Main App Component
    function App() {
      const isTg = Boolean(tg && tg.initData);
      const [mockRole, setMockRole] = useState('viewer');
      const [activeTab, setActiveTab] = useState('schedule');
      
      const [user, setUser] = useState(null);
      const [streamer, setStreamer] = useState(null);
      const [streams, setStreams] = useState([]);
      const [currentStream, setCurrentStream] = useState(null);
      const [suggestions, setSuggestions] = useState([]);
      const [adminStats, setAdminStats] = useState(null);

      const [sugTab, setSugTab] = useState('new');
      const [sugCat, setSugCat] = useState('all');
      const [sugSearch, setSugSearch] = useState('');
      const [dayFilter, setDayFilter] = useState('all');

      const [isSugModalOpen, setIsSugModalOpen] = useState(false);
      const [isStreamModalOpen, setIsStreamModalOpen] = useState(false);
      const [isBroadcastModalOpen, setIsBroadcastModalOpen] = useState(false);
      const [isProfileModalOpen, setIsProfileModalOpen] = useState(false);
      const [isVideosModalOpen, setIsVideosModalOpen] = useState(false);
      const [youtubeVideos, setYoutubeVideos] = useState([]);
      const [editingStream, setEditingStream] = useState(null);
      const [moderatingSug, setModeratingSug] = useState(null);
      const [modStatus, setModStatus] = useState('accepted');
      const [modReply, setModReply] = useState('');
      const [isSubmittingMod, setIsSubmittingMod] = useState(false);

      // Twitch & Points Wallet Modal States
      const [isTwitchModalOpen, setIsTwitchModalOpen] = useState(false);
      const [twitchData, setTwitchData] = useState(null);
      const [manualTwitchInput, setManualTwitchInput] = useState('');
      const [promoCodeInput, setPromoCodeInput] = useState('');
      const [isActivatingCode, setIsActivatingCode] = useState(false);
      const [isClaimingBonus, setIsClaimingBonus] = useState(false);

      // Admin Promo Codes
      const [promocodesList, setPromocodesList] = useState([]);
      const [isPromoModalOpen, setIsPromoModalOpen] = useState(false);

      // Giveaways & Lottery States
      const [giveaways, setGiveaways] = useState([]);
      const [isGiveawayModalOpen, setIsGiveawayModalOpen] = useState(false);
      const [buyTicketsModal, setBuyTicketsModal] = useState({ isOpen: false, giveaway: null, count: 1 });
      const [isBuyingTickets, setIsBuyingTickets] = useState(false);
      const [isPickingWinner, setIsPickingWinner] = useState(false);
      const [newGiveaway, setNewGiveaway] = useState({
        title: '',
        description: '',
        image_url: '',
        ticket_price: 100,
        max_tickets_per_user: 10,
        end_time: ''
      });

      const [toast, setToast] = useState(null);

      const showToast = (text, type = 'info') => {
        setToast({ text, type });
        if (type === 'success') haptic.notify('success');
        else if (type === 'error') haptic.notify('error');
        else haptic.impact('light');
        setTimeout(() => setToast(null), 3000);
      };

      // Fast initial hydration from Telegram
      useEffect(() => {
        if (isTg && tg.initDataUnsafe?.user) {
          const u = tg.initDataUnsafe.user;
          setUser(prev => prev || {
            telegram_id: u.id,
            first_name: u.first_name || 'Зритель',
            last_name: u.last_name,
            username: u.username,
            photo_url: u.photo_url,
            points_balance: 500,
            role: 'viewer'
          });
        }
      }, [isTg]);

      const getHeaders = useCallback(() => {
        const headers = { 'Content-Type': 'application/json' };
        if (isTg && tg.initData) {
          headers['X-Telegram-Init-Data'] = tg.initData;
        }
        if (isTg && tg.initDataUnsafe?.user?.id) {
          headers['X-Mock-User-Id'] = String(tg.initDataUnsafe.user.id);
        } else if (!isTg) {
          headers['X-Mock-User-Id'] = mockRole === 'admin' ? '123456789' : '987654321';
          headers['X-Mock-Role'] = mockRole;
        }
        return headers;
      }, [isTg, mockRole]);

      const loadWallet = useCallback(async () => {
        try {
          const res = await fetch('/api/twitch/wallet', { headers: getHeaders() });
          if (res.ok) {
            const d = await res.json();
            setTwitchData(d);
            setUser(prev => prev ? { ...prev, points_balance: d.points_balance, twitch_username: d.twitch_username, twitch_avatar: d.twitch_avatar } : prev);
          }
        } catch(e) {}
      }, [getHeaders]);

      const handleOAuthTwitch = async () => {
        try {
          haptic.impact('medium');
          const res = await fetch('/api/twitch/auth-url', { headers: getHeaders() });
          if (res.ok) {
            const data = await res.json();
            if (data.is_configured && data.auth_url) {
              openLink(data.auth_url);
            } else {
              showToast('Введите ваш никнейм Twitch в поле ниже для быстрой привязки!', 'info');
            }
          }
        } catch(e) {
          showToast('Ошибка запуска авторизации Twitch', 'error');
        }
      };

      const handleManualTwitchLink = async (e) => {
        e.preventDefault();
        if (!manualTwitchInput.trim()) return;
        try {
          haptic.impact('medium');
          const res = await fetch('/api/twitch/link-manual', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({ twitch_username: manualTwitchInput.trim() })
          });
          const data = await res.json();
          if (res.ok) {
            showToast(data.message, 'success');
            setManualTwitchInput('');
            loadWallet();
          } else {
            showToast(data.detail || 'Ошибка привязки', 'error');
          }
        } catch(e) {
          showToast('Ошибка привязки Twitch', 'error');
        }
      };

      const handleActivatePromoCode = async (e) => {
        if (e) e.preventDefault();
        if (!promoCodeInput.trim()) return;
        try {
          setIsActivatingCode(true);
          haptic.impact('medium');
          const res = await fetch('/api/twitch/activate-code', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({ code: promoCodeInput.trim() })
          });
          const data = await res.json();
          if (res.ok) {
            showToast(data.message, 'success');
            setPromoCodeInput('');
            loadWallet();
            loadAll();
          } else {
            showToast(data.detail || 'Неверный или использованный код', 'error');
          }
        } catch(e) {
          showToast('Ошибка активации промокода', 'error');
        } finally {
          setIsActivatingCode(false);
        }
      };

      const handleClaimDailyBonus = async () => {
        try {
          setIsClaimingBonus(true);
          haptic.impact('medium');
          const res = await fetch('/api/twitch/daily-bonus', {
            method: 'POST',
            headers: getHeaders()
          });
          const data = await res.json();
          if (res.ok) {
            showToast(data.message, 'success');
            loadWallet();
          } else {
            showToast(data.detail || 'Ошибка получения бонуса', 'error');
          }
        } catch(e) {
          showToast('Ошибка получения бонуса', 'error');
        } finally {
          setIsClaimingBonus(false);
        }
      };

      const loadPromocodes = useCallback(async () => {
        try {
          const res = await fetch('/api/admin/promocodes', { headers: getHeaders() });
          if (res.ok) setPromocodesList(await res.json());
        } catch(e) {}
      }, [getHeaders]);

      const handleGeneratePromos = async (pointsReward, count = 1, maxUses = 1, prefix = 'NEKO') => {
        try {
          haptic.impact('medium');
          const res = await fetch('/api/admin/promocodes/generate', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({ points_reward: pointsReward, count: count, max_activations: maxUses, prefix: prefix })
          });
          const data = await res.json();
          if (res.ok) {
            showToast(data.message, 'success');
            loadPromocodes();
          } else {
            showToast('Ошибка генерации кодов', 'error');
          }
        } catch(e) {
          showToast('Ошибка генерации кодов', 'error');
        }
      };

      const handleDeletePromo = async (promoId) => {
        try {
          haptic.impact('medium');
          const res = await fetch(`/api/admin/promocodes/${promoId}`, {
            method: 'DELETE',
            headers: getHeaders()
          });
          if (res.ok) {
            showToast('Код удален', 'info');
            loadPromocodes();
          }
        } catch(e) {}
      };

      const loadVideos = useCallback(async () => {
        try {
          const res = await fetch('/api/admin/videos', { headers: getHeaders() });
          if (res.ok) setYoutubeVideos(await res.json());
        } catch(e) {}
      }, [getHeaders]);

      const loadGiveaways = useCallback(async () => {
        try {
          const res = await fetch('/api/giveaways', { headers: getHeaders() });
          if (res.ok) setGiveaways(await res.json());
        } catch(e) {}
      }, [getHeaders]);

      const handleBuyTickets = async (giveawayId, count = 1) => {
        try {
          setIsBuyingTickets(true);
          haptic.impact('medium');
          const res = await fetch(`/api/giveaways/${giveawayId}/buy-tickets`, {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({ tickets_count: count })
          });
          const data = await res.json();
          if (res.ok) {
            showToast(data.message, 'success');
            setBuyTicketsModal({ isOpen: false, giveaway: null, count: 1 });
            loadGiveaways();
            loadWallet();
            loadAll();
          } else {
            showToast(data.detail || 'Ошибка покупки билетов', 'error');
          }
        } catch(e) {
          showToast('Ошибка покупки билетов', 'error');
        } finally {
          setIsBuyingTickets(false);
        }
      };

      const getDefaultGiveawayEndTime = (daysAhead = 3) => {
        const d = new Date(Date.now() + daysAhead * 24 * 60 * 60 * 1000);
        const pad = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
      };

      const handleCreateGiveaway = async (e) => {
        if (e) e.preventDefault();
        if (!newGiveaway.title || !newGiveaway.title.trim()) {
          showToast('Укажите название приза', 'error');
          return;
        }

        let isoDate = null;
        if (newGiveaway.end_time) {
          try {
            const parsed = new Date(newGiveaway.end_time);
            if (!isNaN(parsed.getTime())) {
              isoDate = parsed.toISOString();
            }
          } catch(err) {}
        }
        if (!isoDate) {
          isoDate = new Date(Date.now() + 3 * 24 * 60 * 60 * 1000).toISOString();
        }

        try {
          haptic.impact('medium');
          const res = await fetch('/api/admin/giveaways', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({
              title: newGiveaway.title.trim(),
              description: newGiveaway.description || '',
              image_url: newGiveaway.image_url || null,
              ticket_price: Math.max(1, parseInt(newGiveaway.ticket_price) || 100),
              max_tickets_per_user: parseInt(newGiveaway.max_tickets_per_user) > 0 ? parseInt(newGiveaway.max_tickets_per_user) : null,
              end_time: isoDate
            })
          });
          const data = await res.json();
          if (res.ok) {
            showToast('Розыгрыш успешно запущен!', 'success');
            setIsGiveawayModalOpen(false);
            setNewGiveaway({ title: '', description: '', image_url: '', ticket_price: 100, max_tickets_per_user: 10, end_time: getDefaultGiveawayEndTime(3) });
            loadGiveaways();
          } else {
            let errorMsg = 'Ошибка создания розыгрыша';
            if (typeof data.detail === 'string') {
              errorMsg = data.detail;
            } else if (Array.isArray(data.detail)) {
              errorMsg = data.detail.map(e => e.msg || e.loc?.join('.')).join(', ');
            }
            showToast(errorMsg, 'error');
          }
        } catch(e) {
          showToast('Ошибка создания розыгрыша: ' + (e.message || ''), 'error');
        }
      };

      const openModerationModal = (sug) => {
        setModeratingSug(sug);
        setModStatus(sug.status === 'pending' ? 'accepted' : sug.status);
        setModReply(sug.admin_reply || '');
      };

      const submitModeration = async (e) => {
        if (e) e.preventDefault();
        if (!moderatingSug) return;
        try {
          setIsSubmittingMod(true);
          haptic.impact('medium');
          const res = await fetch(`/api/suggestions/${moderatingSug.id}/moderate`, {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify({ status: modStatus, admin_reply: modReply })
          });
          if (res.ok) {
            showToast('Статус обновлен, автор уведомлен!', 'success');
            setModeratingSug(null);
            loadAll();
          } else {
            const d = await res.json();
            showToast(d.detail || 'Ошибка сохранения', 'error');
          }
        } catch(e) {
          showToast('Ошибка модерации', 'error');
        } finally {
          setIsSubmittingMod(false);
        }
      };

      const handlePickWinner = async (giveawayId) => {
        if (!confirm('Выбрать случайного победителя прямо сейчас?')) return;
        try {
          setIsPickingWinner(true);
          haptic.impact('heavy');
          const res = await fetch(`/api/admin/giveaways/${giveawayId}/pick-winner`, {
            method: 'POST',
            headers: getHeaders()
          });
          const data = await res.json();
          if (res.ok) {
            showToast(data.message, 'success');
            loadGiveaways();
          } else {
            showToast(data.detail || 'Ошибка выбора победителя', 'error');
          }
        } catch(e) {
          showToast('Ошибка выбора победителя', 'error');
        } finally {
          setIsPickingWinner(false);
        }
      };

      const handleDeleteGiveaway = async (giveawayId) => {
        if (!confirm('Удалить этот розыгрыш?')) return;
        try {
          haptic.impact('medium');
          const res = await fetch(`/api/admin/giveaways/${giveawayId}`, {
            method: 'DELETE',
            headers: getHeaders()
          });
          if (res.ok) {
            showToast('Розыгрыш удален', 'info');
            loadGiveaways();
          }
        } catch(e) {}
      };

      // Load Data
      const loadAll = useCallback(async () => {
        try {
          const headers = getHeaders();
          const meRes = await fetch('/api/auth/me', { headers });
          if (meRes.ok) {
            const meData = await meRes.json();
            setUser(meData);
            setStreamer(meData.streamer_info);
          }

          const [streamsRes, currRes, sugRes, givRes] = await Promise.all([
            fetch('/api/schedule', { headers }),
            fetch('/api/schedule/current', { headers }),
            fetch(`/api/suggestions?tab=${sugTab}&category=${sugCat}&search=${encodeURIComponent(sugSearch)}`, { headers }),
            fetch('/api/giveaways', { headers })
          ]);

          if (streamsRes.ok) setStreams(await streamsRes.json());
          if (currRes.ok) setCurrentStream(await currRes.json());
          if (sugRes.ok) setSuggestions(await sugRes.json());
          if (givRes.ok) setGiveaways(await givRes.json());
        } catch (e) {
          console.warn('API fetch error:', e);
        }
      }, [getHeaders, sugTab, sugCat, sugSearch]);

      useEffect(() => {
        loadAll();
      }, [loadAll]);

      // Load Admin Stats if on admin tab
      useEffect(() => {
        if (activeTab === 'admin' && (user?.role === 'admin' || mockRole === 'admin')) {
          fetch('/api/admin/stats', { headers: getHeaders() })
            .then(r => r.ok ? r.json() : null)
            .then(d => d && setAdminStats(d));
          loadVideos();
          loadPromocodes();
          loadGiveaways();
        }
      }, [activeTab, user?.role, mockRole, getHeaders, loadVideos, loadPromocodes, loadGiveaways]);

      // MainButton binding
      useEffect(() => {
        if (currentStream?.is_live && tg?.MainButton) {
          tg.MainButton.setText(`🔥 СМОТРЕТЬ НА ${currentStream.platform.toUpperCase()}`);
          tg.MainButton.setParams({ color: '#dc2626', text_color: '#ffffff' });
          tg.MainButton.onClick(() => openLink(currentStream.platform_url));
          tg.MainButton.show();
        } else if (tg?.MainButton) {
          tg.MainButton.hide();
        }
        return () => { try { tg?.MainButton?.hide(); } catch(e){} };
      }, [currentStream]);

      // Actions
      const toggleReminder = async (streamId) => {
        haptic.impact('medium');
        try {
          const res = await fetch(`/api/schedule/${streamId}/toggle-reminder`, {
            method: 'POST',
            headers: getHeaders(),
          });
          if (res.ok) {
            const data = await res.json();
            setStreams(prev => prev.map(s => s.id === streamId ? { ...s, has_reminder: data.has_reminder } : s));
            if (currentStream?.id === streamId) setCurrentStream(p => ({ ...p, has_reminder: data.has_reminder }));
            showToast(data.message, 'success');
          }
        } catch(e) { showToast('Ошибка напоминания', 'error'); }
      };

      const voteSug = async (sugId) => {
        haptic.impact('medium');
        try {
          const res = await fetch(`/api/suggestions/${sugId}/vote`, {
            method: 'POST',
            headers: getHeaders(),
          });

                        { emoji: '👕', label: 'Мерч' },
                        { emoji: '🔑', label: 'Ключ' },
                        { emoji: '🍕', label: 'Еда' },
                        { emoji: '🎧', label: 'Гаджет' }
                      ].map(item => (
                        <button
                          key={item.emoji}
                          type="button"
                          onClick={() => setNewGiveaway(p => ({ ...p, image_url: item.emoji }))}
                          className={`p-1.5 rounded-xl border text-center font-bold flex items-center justify-center gap-1 btn-press ${
                            newGiveaway.image_url === item.emoji || (!newGiveaway.image_url && item.emoji === '🎁')
                              ? 'bg-amber-500/30 border-amber-400 text-amber-300 shadow-sm'
                              : 'bg-slate-950 border-slate-800 text-slate-400 hover:border-slate-700'
                          }`}
                        >
                          <span className="text-base">{item.emoji}</span>
                          <span className="text-[10px]">{item.label}</span>
                        </button>
                      ))}
                    </div>

                    <input
                      type="text"
                      value={newGiveaway.image_url && !['🎁', '💎', '🎮', '💰', '👕', '🔑', '🍕', '🎧'].includes(newGiveaway.image_url) ? newGiveaway.image_url : ''}
                      onChange={(e) => setNewGiveaway(p => ({ ...p, image_url: e.target.value }))}
                      placeholder="Или вставьте ссылку https://... (по желанию)"
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white placeholder:text-slate-500 text-xs mt-1"
                    />
                  </div>

                  {/* Ticket Price & Max Tickets */}
                  <div className="grid grid-cols-2 gap-2">
                    <div className="space-y-1">
                      <label className="text-slate-300 font-semibold">Цена билета (PTS) *</label>
                      <input
                        type="number"
                        min="1"
                        value={newGiveaway.ticket_price}
                        onChange={(e) => setNewGiveaway(p => ({ ...p, ticket_price: e.target.value }))}
                        placeholder="100"
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold"
                        required
                      />
                    </div>

                    <div className="space-y-1">
                      <label className="text-slate-300 font-semibold">Лимит на чел. (шт.)</label>
                      <input
                        type="number"
                        min="0"
                        value={newGiveaway.max_tickets_per_user}
                        onChange={(e) => setNewGiveaway(p => ({ ...p, max_tickets_per_user: e.target.value }))}
                        placeholder="0 = без лимита"
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white"
                      />
                    </div>
                  </div>

                  {/* End Time & Quick Presets */}
                  <div className="space-y-1.5">
                    <div className="flex items-center justify-between">
                      <label className="text-slate-300 font-semibold">Длительность / Окончание *</label>
                    </div>

                    {/* Quick Duration Buttons */}
                    <div className="grid grid-cols-4 gap-1.5 text-[10px]">
                      {[
                        { label: '1 день', days: 1 },
                        { label: '3 дня', days: 3 },
                        { label: '7 дней', days: 7 },
                        { label: '14 дней', days: 14 }
                      ].map(preset => (
                        <button
                          key={preset.days}
                          type="button"
                          onClick={() => setNewGiveaway(p => ({ ...p, end_time: getDefaultGiveawayEndTime(preset.days) }))}
                          className="py-1.5 px-1 bg-slate-950 hover:bg-slate-800 border border-slate-700 text-slate-300 rounded-lg text-center font-bold btn-press"
                        >
                          +{preset.label}
                        </button>
                      ))}
                    </div>

                    <input
                      type="datetime-local"
                      value={newGiveaway.end_time ? String(newGiveaway.end_time).slice(0, 16) : ''}
                      onChange={(e) => setNewGiveaway(p => ({ ...p, end_time: e.target.value }))}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white text-xs mt-1"
                      required
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full py-3 mt-2 rounded-xl bg-gradient-to-r from-amber-500 via-rose-500 to-purple-600 hover:brightness-110 text-white font-bold text-xs shadow-lg btn-press flex items-center justify-center gap-1.5"
                  >
                    <span>🚀</span>
                    <span>Запустить розыгрыш</span>
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* BUY TICKETS MODAL (VIEWER) */}
          {buyTicketsModal.isOpen && buyTicketsModal.giveaway && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
              <div className="bg-slate-900 border border-purple-500/40 rounded-3xl p-5 w-full max-w-sm shadow-2xl space-y-4">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">🎟️</span>
                    <h3 className="font-display font-bold text-base text-white">Покупка билетов</h3>
                  </div>
                  <button
                    onClick={() => setBuyTicketsModal({ isOpen: false, giveaway: null, count: 1 })}
                    className="text-slate-400 hover:text-white p-1 rounded-lg"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-3 rounded-2xl bg-purple-950/40 border border-purple-500/30 flex items-center gap-3">
                  {buyTicketsModal.giveaway.image_url?.startsWith('http') || buyTicketsModal.giveaway.image_url?.startsWith('/') ? (
                    <img src={buyTicketsModal.giveaway.image_url} className="w-12 h-12 rounded-xl object-cover border border-amber-500/30" alt="prize" />
                  ) : (
                    <div className="w-12 h-12 rounded-xl bg-gradient-to-tr from-amber-500 to-rose-500 flex items-center justify-center text-2xl flex-shrink-0 shadow-md">
                      {buyTicketsModal.giveaway.image_url || '🎁'}
                    </div>
                  )}
                  <div className="min-w-0">
                    <div className="font-bold text-white text-xs truncate">{buyTicketsModal.giveaway.title}</div>
                    <div className="text-[10px] text-purple-300">
                      Цена 1 билета: <strong className="text-amber-300">{buyTicketsModal.giveaway.ticket_price} PTS</strong>
                    </div>
                  </div>
                </div>

                {/* Quick Count Selectors */}
                <div className="space-y-1.5">
                  <div className="text-xs text-slate-300 font-semibold">Выберите количество:</div>
                  <div className="grid grid-cols-3 gap-2 text-xs">
                    {[1, 5, 10].map(cnt => (
                      <button
                        key={cnt}
                        type="button"
                        onClick={() => setBuyTicketsModal(p => ({ ...p, count: cnt }))}
                        className={`p-2.5 rounded-xl border text-center font-bold btn-press ${
                          buyTicketsModal.count === cnt
                            ? 'bg-gradient-to-r from-purple-600 to-indigo-600 border-purple-400 text-white shadow-md'
                            : 'bg-slate-950 border-slate-800 text-slate-300 hover:border-slate-700'
                        }`}
                      >
                        {cnt} {cnt === 1 ? 'билет' : cnt < 5 ? 'билета' : 'билетов'}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Summary & Cost */}
                {(() => {
                  const totalCost = buyTicketsModal.count * buyTicketsModal.giveaway.ticket_price;
                  const currentBalance = user?.points_balance || 0;
                  const canAfford = currentBalance >= totalCost;
                  const currentTickets = buyTicketsModal.giveaway.user_tickets_count || 0;
                  const maxLimit = buyTicketsModal.giveaway.max_tickets_per_user;
                  const exceedsLimit = maxLimit && (currentTickets + buyTicketsModal.count > maxLimit);

                  return (
                    <div className="space-y-3 pt-1">
                      <div className="bg-slate-950/80 p-3 rounded-xl border border-white/10 space-y-1 text-xs">
                        <div className="flex justify-between text-slate-300">
                          <span>Стоимость ({buyTicketsModal.count} шт.):</span>
                          <span className="font-bold text-amber-300">{totalCost.toLocaleString('ru-RU')} PTS</span>
                        </div>
                        <div className="flex justify-between text-slate-400 text-[11px]">
                          <span>Ваш баланс:</span>
                          <span className={canAfford ? 'text-emerald-400 font-semibold' : 'text-rose-400 font-semibold'}>
                            {currentBalance.toLocaleString('ru-RU')} PTS
                          </span>
                        </div>
                        {maxLimit && (
                          <div className="text-[10px] text-slate-400 pt-1 border-t border-white/5">
                            Куплено: {currentTickets}/{maxLimit} шт.
                          </div>
                        )}
                      </div>

                      {exceedsLimit ? (
                        <div className="p-2 rounded-xl bg-rose-950/50 border border-rose-500/40 text-[11px] text-rose-300 text-center">
                          Превышен лимит билетов на одного человека ({maxLimit} шт.)
                        </div>
                      ) : !canAfford ? (
                        <div className="p-2 rounded-xl bg-rose-950/50 border border-rose-500/40 text-[11px] text-rose-300 text-center">
                          Недостаточно баллов на балансе
                        </div>
                      ) : null}

                      <button
                        onClick={() => handleBuyTickets(buyTicketsModal.giveaway.id, buyTicketsModal.count)}
                        disabled={isBuyingTickets || !canAfford || exceedsLimit}
                        className={`w-full py-3 rounded-xl font-bold text-xs shadow-lg btn-press flex items-center justify-center gap-1.5 ${
                          canAfford && !exceedsLimit
                            ? 'bg-gradient-to-r from-amber-500 via-rose-500 to-purple-600 hover:brightness-110 text-white'
                            : 'bg-slate-800 text-slate-500 cursor-not-allowed'
                        }`}
                      >
                        <span>🎟️</span>
                        <span>{isBuyingTickets ? 'Покупка...' : `Оплатить ${totalCost.toLocaleString('ru-RU')} PTS`}</span>
                      </button>
                    </div>
                  );
                })()}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
